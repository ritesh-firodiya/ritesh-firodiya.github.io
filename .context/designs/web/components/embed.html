<template variant="phone"><div class="embed embed--phone"><iframe src="{src}" title="{label}" loading="lazy" tabindex="-1"></iframe></div></template>
</head>

  <div class="aspect-[4/3] w-[300px] overflow-hidden"><c-embed variant="fill" src="../../../../../../products/scrvio/.context/designs/web/home/home.html?bare" label="Scrvio design screen"></c-embed></div>
  <div class="w-40"><c-embed variant="phone" src="../../../../../../products/chitragupt/.context/designs/mobile/home/home.html?bare" label="Chitragupt mobile screen"></c-embed></div>
