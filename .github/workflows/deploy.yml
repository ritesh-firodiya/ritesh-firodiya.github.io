name: Deploy to GitHub Pages

# Build the static export and publish it. The site has no request-time data and
# no islands, so `next build` with output:"export" produces the whole thing as
# plain HTML and Pages just serves it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do not cancel one in flight — a cancelled
# deploy can leave Pages pointing at a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint and types are separate steps on purpose: a red type-check and a red
      # lint are different problems and the log should say which one failed.
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # Pull the design sets out of the private app repos. They are not stored
      # in this public repo, so this has to happen before the build or every
      # product page ships with its screens missing.
      #
      # DESIGNS_TOKEN is a fine-grained PAT on the ritvi-apps org with exactly
      # one permission: Contents: read. It expires; when it does this step
      # fails loudly rather than deploying a site with holes in it.
      - name: Pull design sets from the private app repos
        env:
          DESIGNS_TOKEN: ${{ secrets.DESIGNS_TOKEN }}
          DESIGNS_SOURCE: remote
        run: |
          test -n "$DESIGNS_TOKEN" || {
            echo "::error::secrets.DESIGNS_TOKEN is not set. Create a fine-grained PAT"
            echo "::error::on ritvi-apps with Contents: read, and add it as a repo secret."
            exit 1
          }
          pnpm designs

      # Both palettes, every pair, computed from globals.css rather than
      # remembered. The theme this replaced carried a comment claiming a ratio
      # the colour beside it did not meet.
      - run: pnpm contrast

      - run: pnpm build

      # app-ads.txt is live AdMob revenue for Tic Tac Toe — AdMob only honours it
      # on the domain named in the Play listing's developer-website field, and a
      # missing file silently marks the inventory unauthorised. Fail loudly here
      # rather than find out from a revenue chart three weeks later.
      - name: Verify app-ads.txt survived the export
        run: |
          test -f out/app-ads.txt || { echo "::error::out/app-ads.txt is missing"; exit 1; }
          grep -q "pub-" out/app-ads.txt || { echo "::error::out/app-ads.txt has no publisher id"; exit 1; }
          echo "app-ads.txt ok: $(cat out/app-ads.txt)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
