<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barcode — AskCal mobile</title>
  <script src="../../../_vendor/tailwind.js"></script>
  <script src="../tailwind.config.js"></script>
  <script src="../../../_vendor/lucide.js"></script>
  <link rel="stylesheet" href="../shared.css" />
</head>
<body>



<!--
  OpenFoodFacts. The only path in the app that returns label-exact numbers, so
  the result sheet says "Label" confidence — a stronger claim than "Seen", and
  the one case where we are not estimating at all.
-->

<div class="phone phone--camera">

  <div class="statusbar statusbar--on-dark">
    <span class="statusbar-time mono">9:41</span>
    <div class="statusbar-icons">
      <i data-lucide="signal" style="width:15px;height:15px"></i>
      <i data-lucide="wifi" style="width:15px;height:15px"></i>
      <i data-lucide="battery-full" style="width:24px;height:14px"></i>
    </div>
  </div>

  <div class="appheader" style="padding-top:4px">
    <a href="../home/today.html" class="iconbtn iconbtn--on-dark" aria-label="Close">
      <i data-lucide="x" style="width:20px;height:20px"></i>
    </a>
    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full" style="background:rgba(255,255,255,0.14)">
      <i data-lucide="infinity" style="width:13px;height:13px;color:#fff"></i>
      <span class="text-[11.5px] font-extrabold text-white">Free &amp; unlimited</span>
    </div>
    <button class="iconbtn iconbtn--on-dark" aria-label="Flash">
      <i data-lucide="zap" style="width:19px;height:19px"></i>
    </button>
  </div>

  <div style="position:relative;height:300px;margin-top:12px">
    <div class="viewfinder" style="position:absolute;inset:0;background:#171f1c">
      <div class="vf-frame" style="width:270px;height:150px;border-radius:16px">
        <span class="vf-corner" style="top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:8px 0 0 0"></span>
        <span class="vf-corner" style="top:-2px;right:-2px;border-left:none;border-bottom:none;border-radius:0 8px 0 0"></span>
        <span class="vf-corner" style="bottom:-2px;left:-2px;border-right:none;border-top:none;border-radius:0 0 0 8px"></span>
        <span class="vf-corner" style="bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 8px 0"></span>
        <div style="position:absolute;top:50%;left:14px;right:14px;height:2px;background:var(--brand-400);box-shadow:0 0 12px var(--brand-400)"></div>
      </div>
    </div>
    <p class="text-center text-[12.5px] font-bold text-white" style="position:absolute;bottom:16px;left:0;right:0;opacity:0.85">
      Line the barcode up inside the box
    </p>
  </div>

  <!-- Found sheet -->
  <div class="sheet" style="position:absolute;bottom:0;left:0;right:0">
    <div class="sheet-grip"></div>

    <div class="flex items-center gap-3.5">
      <div class="meal-thumb" style="width:56px;height:56px;background:var(--info-bg)">
        <i data-lucide="milk" style="width:22px;height:22px;color:var(--info-fg)"></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-black text-[15px] leading-tight">Greek Yoghurt, Natural</p>
        <p class="text-[11.5px] text-ink-3 mt-0.5">Fage · <span class="mono">5201054012345</span></p>
      </div>
      <span class="conf conf-high"><span class="conf-dot conf-dot--high"></span>Label</span>
    </div>

    <div class="card card--sunken mt-3.5" style="padding:13px">
      <div class="flex items-center justify-between">
        <span class="text-[12px] font-bold text-ink-2">Portion</span>
        <div class="flex items-center gap-2.5">
          <button class="iconbtn" aria-label="Less" style="width:40px;height:40px;background:#fff"><i data-lucide="minus" style="width:15px;height:15px"></i></button>
          <span class="num font-black text-[15px]" style="min-width:52px;text-align:center">170 g</span>
          <button class="iconbtn" aria-label="More" style="width:40px;height:40px;background:#fff"><i data-lucide="plus" style="width:15px;height:15px"></i></button>
        </div>
      </div>
    </div>

    <div class="flex items-baseline justify-between mt-3.5">
      <div>
        <p class="section-label">Total</p>
        <p class="num font-black" style="font-size:26px;line-height:1;color:var(--brand-700)">
          164<span class="text-[13px] font-extrabold text-ink-3 ml-1">kcal</span>
        </p>
      </div>
      <div class="flex items-center gap-3 text-[11px]">
        <span class="flex items-center gap-1.5"><span class="macro-dot m-protein"></span><span class="num font-extrabold">17g</span></span>
        <span class="flex items-center gap-1.5"><span class="macro-dot m-carbs"></span><span class="num font-extrabold">6g</span></span>
        <span class="flex items-center gap-1.5"><span class="macro-dot m-fat"></span><span class="num font-extrabold">8g</span></span>
      </div>
    </div>

    <a href="../home/today.html" class="btn btn-primary mt-4"><span>Add to today</span></a>
    <p class="text-center text-[10.5px] text-ink-3 mt-2">Data from OpenFoodFacts · didn't use a scan</p>
  </div>

</div>

<script>lucide.createIcons();</script>
</body>
</html>
