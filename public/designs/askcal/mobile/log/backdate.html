<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>When did you eat this? — AskCal mobile</title>
  <script src="../../../_vendor/tailwind.js"></script>
  <script src="../tailwind.config.js"></script>
  <script src="../../../_vendor/lucide.js"></script>
  <link rel="stylesheet" href="../shared.css" />
</head>
<body>



<div class="phone phone--page">

  <div class="statusbar">
    <span class="statusbar-time mono">9:41</span>
    <div class="statusbar-icons">
      <i data-lucide="signal" style="width:15px;height:15px"></i>
      <i data-lucide="wifi" style="width:15px;height:15px"></i>
      <i data-lucide="battery-full" style="width:24px;height:14px"></i>
    </div>
  </div>

  <div class="subheader">
    <a href="confirm.html" class="backbtn" aria-label="Back"><i data-lucide="arrow-left" style="width:19px;height:19px"></i></a>
    <div class="flex-1 text-center">
      <p class="subheader-title">When did you eat this?</p>
      <p class="subheader-sub">Chicken biryani · 712 kcal</p>
    </div>
    <div style="width:38px"></div>
  </div>

  <!--
    BUILT AS A SHEET ON THE MEAL SCREEN, not as a route.

    The thing being moved is one meal, and a screen of its own would have to be
    handed the id, the day and a way back to exactly where it came from. It is
    a sheet opened from the meal's own date line instead — same choices, no
    navigation to unwind.

    The calendar second step is NOT built. Seven relative days cover every real
    backdating case in a calorie log; nobody is correcting last March, and a
    date picker nothing opens is worse than one that does not exist.

    The sheet carries the TIME as well as the day, in quarter-hour steps. This
    screen originally left the clock to the meal slot on the grounds that a
    calorie log is not sensitive to whether lunch was 1:05 or 1:40 — which is
    true of the total and false of the record: the app stamps a time whether or
    not the user chose it, and a meal logged at 11pm for something eaten at
    lunch reads as wrong every time it is looked at. Quarter-hours keep it to a
    few taps without pretending to a precision nothing needs.

    Relative days first, calendar second.

    People do not think "16 September", they think "yesterday" and "Monday".
    Four taps cover almost every real backdating case; the calendar exists for
    the rest and is one tap away rather than the first thing demanded.
  -->
  <div class="px-5 mt-3">
    <p class="section-label">Day</p>
    <div class="mt-2 grid grid-cols-2 gap-2">
      <button class="card card--interactive" style="padding:13px 14px;text-align:left">
        <p class="font-extrabold text-[13px] text-ink">Today</p>
        <p class="text-[11px] text-ink-3 mt-0.5">Thursday 19</p>
      </button>
      <button class="card card--brand" style="padding:13px 14px;text-align:left">
        <p class="font-extrabold text-[13px]" style="color:var(--brand-700)">Yesterday</p>
        <p class="text-[11px] mt-0.5" style="color:var(--brand-700);opacity:0.75">Wednesday 18</p>
      </button>
      <button class="card card--interactive" style="padding:13px 14px;text-align:left">
        <p class="font-extrabold text-[13px] text-ink">Tuesday</p>
        <p class="text-[11px] text-ink-3 mt-0.5">17 Sep</p>
      </button>
      <button class="card card--interactive" style="padding:13px 14px;text-align:left">
        <p class="font-extrabold text-[13px] text-ink">Monday</p>
        <p class="text-[11px] text-ink-3 mt-0.5">16 Sep</p>
      </button>
    </div>

    <button class="card card--interactive mt-2 flex items-center gap-3 w-full" style="padding:12px 14px">
      <div class="comp-puck" style="background:var(--sunken);color:var(--ink-2);width:32px;height:32px">
        <i data-lucide="calendar" style="width:16px;height:16px"></i>
      </div>
      <p class="flex-1 font-extrabold text-[13px] text-ink" style="text-align:left">Pick another date</p>
      <i data-lucide="chevron-right" style="width:18px;height:18px;color:var(--ink-3)"></i>
    </button>
  </div>

  <!--
    Meal slot carries the time, so most people never touch the clock.

    A slot implies an hour well enough for a calorie log — nothing here is
    sensitive to whether lunch was 1:05 or 1:40 — and asking for a precise time
    on every entry is friction paid for nothing.
  -->
  <div class="px-5 mt-5">
    <p class="section-label">Meal</p>
    <div class="segmented segmented--full mt-2">
      <button class="seg">Breakfast</button>
      <button class="seg is-active">Lunch</button>
      <button class="seg">Dinner</button>
      <button class="seg">Snack</button>
    </div>
  </div>

  <div class="px-5 mt-4">
    <div class="card flex items-center gap-3" style="padding:13px 14px">
      <div class="comp-puck" style="background:var(--sunken);color:var(--ink-2);width:32px;height:32px">
        <i data-lucide="clock" style="width:16px;height:16px"></i>
      </div>
      <div class="flex-1">
        <p class="font-extrabold text-[13px] text-ink">1:00 pm</p>
        <p class="text-[11px] text-ink-3 mt-0.5">From the meal — tap to set exactly</p>
      </div>
      <i data-lucide="chevron-right" style="width:18px;height:18px;color:var(--ink-3)"></i>
    </div>
  </div>

  <!--
    What this does to the record, said before it happens.

    Backdating changes a day that is already closed and may already have been
    looked at. Saying so is the difference between a tool and a thing that
    quietly rewrites your history.
  -->
  <div class="px-5 mt-5">
    <div class="card card--muted flex items-start gap-3" style="padding:13px 14px">
      <i data-lucide="info" style="width:17px;height:17px;color:var(--ink-3);flex:none;margin-top:1px"></i>
      <p class="text-[11px] leading-relaxed text-ink-3">
        This adds 712 kcal to <span class="font-bold text-ink-2">Wednesday 18</span>, taking it from
        1,840 to 2,552 — over target for that day. Your streak is unaffected; it already counted Wednesday.
      </p>
    </div>
  </div>

  <div style="height:120px"></div>

  <div class="sticky-bottom">
    <a href="../home/day-past.html" class="btn btn-primary">Add to Wednesday</a>
  </div>

</div>

<script>lucide.createIcons()</script>
</body>
</html>
