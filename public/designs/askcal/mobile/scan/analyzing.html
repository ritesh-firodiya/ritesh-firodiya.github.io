<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analyzing — AskCal mobile</title>
  <script src="../../../_vendor/tailwind.js"></script>
  <script src="../tailwind.config.js"></script>
  <script src="../../../_vendor/lucide.js"></script>
  <link rel="stylesheet" href="../shared.css" />
</head>
<body>



<!--
  ~2 seconds. Shows the skeleton of the result rather than a spinner, so the
  wait explains what is about to arrive. Steps tick through in order and the
  third one names the thing the product is actually for.
-->

<div class="phone phone--page">

  <div class="statusbar">
    <span class="statusbar-time mono">9:41</span>
    <div class="statusbar-icons">
      <i data-lucide="signal" style="width:15px;height:15px"></i>
      <i data-lucide="wifi" style="width:15px;height:15px"></i>
      <i data-lucide="battery-full" style="width:24px;height:14px"></i>
    </div>
  </div>

  <div class="subheader">
    <a href="camera.html" class="backbtn" aria-label="Cancel">
      <i data-lucide="x" style="width:22px;height:22px"></i>
    </a>
    <div><p class="subheader-title">Reading the plate</p></div>
    <span></span>
  </div>

  <div class="px-5">
    <div class="card" style="padding:14px">
      <div class="flex items-center gap-3.5">
        <div class="meal-thumb" style="width:64px;height:64px;background:#f0e4d4">
          <i data-lucide="utensils" style="width:24px;height:24px;color:#a1785a"></i>
        </div>
        <div class="flex-1">
          <div class="skel" style="height:15px;width:62%"></div>
          <div class="skel mt-2" style="height:11px;width:38%"></div>
        </div>
      </div>
      <div class="mt-3.5 pt-3.5" style="border-top:1px solid var(--line)">
        <div class="skel" style="height:30px;width:44%"></div>
        <div class="skel mt-3" style="height:8px;width:100%;border-radius:999px"></div>
      </div>
    </div>
  </div>

  <!-- What it's doing, in order -->
  <div class="px-5 mt-5 grid gap-3">
    <div class="flex items-center gap-3">
      <span style="width:22px;height:22px;border-radius:999px;background:var(--brand-500);display:flex;align-items:center;justify-content:center;flex:none">
        <i data-lucide="check" style="width:13px;height:13px;color:#fff" stroke-width="4"></i>
      </span>
      <p class="text-[13px] font-bold">Found the plate</p>
    </div>

    <div class="flex items-center gap-3">
      <span style="width:22px;height:22px;border-radius:999px;border:2.5px solid var(--brand-500);border-top-color:transparent;flex:none;animation:spin 0.8s linear infinite"></span>
      <p class="text-[13px] font-bold">Naming what's on it</p>
    </div>

    <div class="flex items-center gap-3">
      <span style="width:22px;height:22px;border-radius:999px;border:2px solid var(--line-strong);flex:none"></span>
      <p class="text-[13px] font-semibold text-ink-3">Working out what it can't see</p>
    </div>
  </div>

  <div class="px-5 mt-7">
    <div class="skel" style="height:58px;border-radius:var(--r)"></div>
    <div class="skel mt-2" style="height:58px;border-radius:var(--r)"></div>
    <div class="skel mt-2" style="height:58px;border-radius:var(--r);opacity:0.55"></div>
  </div>

  <p class="px-5 mt-6 text-center text-[11.5px] text-ink-3">
    Usually about two seconds
  </p>

  <!-- Failure branches from here: no food found, too dark, offline, server busy -->
  <p class="px-5 mt-2 text-center text-[11px]">
    <a href="result.html" style="color:var(--brand-700);font-weight:700">→ success</a>
    <span class="text-ink-4 mx-1">·</span>
    <a href="failed.html" style="color:var(--danger-fg);font-weight:700">→ failure</a>
  </p>

</div>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<script>lucide.createIcons();</script>
</body>
</html>
