<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Purchase success — Charades mobile</title>
  <script src="../../../_vendor/tailwind.js"></script>
  <script src="../tailwind.config.js"></script>
  <link rel="stylesheet" href="../shared.css" />
</head>
<body>

<div class="breadcrumb">
  <div class="breadcrumb-inner">
    <span class="breadcrumb-label">Mobile · <span class="text-zinc-700">/patterns</span> ›</span>
    <a href="purchase-success.html" class="breadcrumb-chip is-current">Purchase success</a>
    <a href="toasts.html" class="breadcrumb-chip">Toasts</a>
    <a href="../index.html" class="breadcrumb-chip" style="margin-left:auto">← All routes</a>
  </div>
</div>

<div class="phone phone--sunken">

  <div class="backdrop"></div>

  <!-- Modal card -->
  <div class="absolute inset-x-6 top-1/2 -translate-y-1/2 rounded-3xl bg-white p-6 text-center shadow-lg">

    <!-- Icon with confetti -->
    <div class="relative w-24 h-24 mx-auto mb-4">
      <div class="absolute inset-0 rounded-full bg-emerald-100 animate-ping opacity-40"></div>
      <div class="relative w-24 h-24 rounded-full bg-emerald-500 flex items-center justify-center">
        <i data-lucide="check" class="text-white" style="width:44px;height:44px" stroke-width="3.5"></i>
      </div>
      <!-- confetti dots -->
      <span class="absolute -top-1 left-4 w-2 h-2 rounded-full bg-amber-400"></span>
      <span class="absolute top-2 -right-2 w-1.5 h-1.5 rounded-full bg-rose-400"></span>
      <span class="absolute bottom-2 -left-3 w-2 h-2 rounded-full bg-blue-400"></span>
      <span class="absolute -bottom-1 right-6 w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
    </div>

    <h2 class="text-xl font-black navy">You're all set!</h2>
    <p class="mt-2 text-[13px] text-zinc-600 leading-relaxed"><b class="text-zinc-900">Family: Animals</b> is unlocked.<br/>Ads have been turned off for good.</p>

    <div class="mt-5 rounded-2xl bg-zinc-50 p-3 flex items-center justify-around">
      <div class="flex flex-col items-center gap-1">
        <div class="w-9 h-9 rounded-xl tint-family flex items-center justify-center">
          <i data-lucide="paw-print" style="width:18px;height:18px"></i>
        </div>
        <p class="text-[9px] uppercase tracking-widest text-zinc-500 font-black">New pack</p>
        <p class="text-[12px] font-black navy leading-none">Animals</p>
      </div>
      <div class="w-px h-12 bg-zinc-200"></div>
      <div class="flex flex-col items-center gap-1">
        <div class="w-9 h-9 rounded-xl bg-gold-50 flex items-center justify-center">
          <i data-lucide="plus" class="gold" style="width:18px;height:18px" stroke-width="3"></i>
        </div>
        <p class="text-[9px] uppercase tracking-widest text-zinc-500 font-black">Cards</p>
        <p class="text-[12px] font-black navy leading-none">+113</p>
      </div>
      <div class="w-px h-12 bg-zinc-200"></div>
      <div class="flex flex-col items-center gap-1">
        <div class="w-9 h-9 rounded-xl bg-emerald-50 flex items-center justify-center">
          <i data-lucide="shield-off" class="text-emerald-600" style="width:18px;height:18px"></i>
        </div>
        <p class="text-[9px] uppercase tracking-widest text-zinc-500 font-black">Ads</p>
        <p class="text-[12px] font-black text-emerald-700 leading-none">Off</p>
      </div>
    </div>

    <button class="btn btn-primary mt-5">
      <i data-lucide="play" fill="currentColor" style="width:18px;height:18px"></i>
      Play now
    </button>
    <button class="mt-2 w-full text-[11px] font-bold text-zinc-500 py-2">Keep browsing</button>
  </div>

</div>

<script src="../../../_vendor/lucide.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
