<!doctype html>
<html lang="en" class="dark">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Raise a concern — Chitragupt mobile</title><script src="../../../../_vendor/tailwind.js"></script><style>body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0a0a0a}.mono{font-family:ui-monospace,monospace}.phone{max-width:390px;margin:0 auto;background:#09090b;min-height:100dvh;position:relative;padding-bottom:100px;box-shadow:0 0 0 1px #18181b}@media (min-width:640px){.phone{min-height:844px;margin:16px auto;border-radius:32px;overflow:hidden;box-shadow:0 0 0 1px #27272a,0 30px 60px -20px rgba(0,0,0,.7)}}.tabbar{position:absolute;inset-inline:0;bottom:0}</style></head>
<body class="text-zinc-100" data-chrome data-chrome-rel="../" data-chrome-tab="tax" data-chrome-title="Raise a concern" data-chrome-section="/tax" data-chrome-routes="Review|tax-review.html;Locked|tax-locked.html;Empty|tax-empty.html;Filed|tax-filed.html;With CA|tax-with-ca.html;CA invited|tax-ca-invited.html;Family locked|tax-family-locked.html;Family stacked|tax-family.html;Past AY|tax-past-ay.html;Invite CA|invite-ca.html;Concern|concern.html|1" data-chrome-top="level2" data-chrome-back="tax-review.html" data-chrome-notif-badge="3">

<div data-chrome-slot="super"></div>

<div class="phone">
<div data-chrome-slot="status"></div>
<div data-chrome-slot="top"></div>

<main class="px-4 pt-2">

  <section class="rounded-2xl border border-amber-500/30 bg-amber-500/5 p-4">
    <p class="text-[10px] uppercase tracking-widest text-amber-300">Tell us what's off</p>
    <p class="mt-1 text-[12px] text-zinc-300">Use this if the computation doesn't match your understanding — before exporting. Goes to a human reviewer (1-day SLA).</p>
  </section>

  <form class="mt-4 space-y-3">
    <label class="block">
      <span class="text-[11px] text-zinc-400">What's the concern about?</span>
      <select class="mt-1 block w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-3 text-sm focus:border-emerald-500 focus:outline-none">
        <option>Tax position seems wrong</option>
        <option>A deduction was missed</option>
        <option>26AS / Form 16 mismatch I can't resolve</option>
        <option>Capital gains computation</option>
        <option>Regime picker · think old should win</option>
        <option>Quick Check question doesn't fit my case</option>
        <option>Other</option>
      </select>
    </label>

    <label class="block">
      <span class="text-[11px] text-zinc-400">Describe it</span>
      <textarea rows="5" placeholder="What did you expect? What does Chitragupt show?" class="mt-1 block w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-2.5 text-[13px] focus:border-emerald-500 focus:outline-none"></textarea>
    </label>

    <label class="block">
      <span class="text-[11px] text-zinc-400">Attach a screenshot or doc (optional)</span>
      <button type="button" class="mt-1 flex w-full items-center justify-center gap-2 rounded-md border border-dashed border-zinc-700 bg-zinc-900/40 px-3 py-3 text-[12px] text-zinc-400">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Attach file
      </button>
    </label>

    <div class="rounded-md border border-emerald-500/30 bg-emerald-500/5 px-3 py-2 text-[11px] text-emerald-200">
      We'll auto-include your AY 26-27 tax computation summary &amp; doc list. <a href="../settings/settings-sharing.html" class="underline">What's shared</a>
    </div>

    <button class="block w-full rounded-xl bg-emerald-500 px-4 py-3.5 text-sm font-semibold text-zinc-950">Send to support</button>
    <p class="text-center text-[10.5px] text-zinc-500">Average reply: 6 hours · we don't auto-edit your computation</p>
  </form>

</main>

<div data-chrome-slot="tab"></div>
</div>

<script src="../../_chrome.js"></script>
</body></html>
