<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign up — Chitragupt mobile</title>
<script src="../../../_vendor/tailwind.js"></script>
<style>body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0a0a0a}.mono{font-family:ui-monospace,monospace}.phone{max-width:390px;margin:0 auto;background:#09090b;min-height:100dvh;position:relative;box-shadow:0 0 0 1px #18181b}@media (min-width:640px){.phone{min-height:844px;margin:16px auto;border-radius:32px;overflow:hidden;box-shadow:0 0 0 1px #27272a,0 30px 60px -20px rgba(0,0,0,.7)}}</style>
</head>
<body class="text-zinc-100">

<div class="border-b border-dashed border-zinc-800 bg-zinc-900/30 px-5 py-2">
  <div class="mx-auto flex max-w-4xl flex-wrap items-center gap-1.5 text-[11px]">
    <span class="mr-1 text-[10px] uppercase tracking-widest text-zinc-500">Mobile · /auth ›</span>
    <a href="sign-in.html" class="rounded border border-zinc-700 bg-zinc-900 px-2 py-0.5 text-zinc-300">Sign in</a>
    <a href="sign-up.html" class="rounded border border-emerald-500/50 bg-emerald-500/15 px-2 py-0.5 font-semibold text-emerald-200">Sign up</a>
    <a href="verify-email.html" class="rounded border border-zinc-700 bg-zinc-900 px-2 py-0.5 text-zinc-300">Verify email</a>
    <a href="../index.html" class="ml-auto rounded border border-zinc-700 bg-zinc-900 px-2 py-0.5 text-zinc-300">← All</a>
  </div>
</div>

<div class="phone">
  <div class="flex items-center justify-between px-6 pt-3 pb-1 text-[11px] text-zinc-300"><span class="mono">9:41</span><div class="flex items-center gap-1.5"><svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><rect x="0" y="6" width="2" height="4"/><rect x="3.5" y="4" width="2" height="6"/><rect x="7" y="2" width="2" height="8"/><rect x="10.5" y="0" width="2" height="10"/></svg><svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4a8 8 0 0 1 12 0M3 6a5 5 0 0 1 8 0M6 8.5l1 1 1-1"/></svg><svg width="22" height="11" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="18" height="10" rx="2"/><rect x="19.5" y="3.5" width="2" height="4" rx="0.5" fill="currentColor"/><rect x="2" y="2" width="13" height="7" rx="1" fill="currentColor"/></svg></div></div>

  <div class="flex h-12 items-center justify-between px-4">
    <a href="#" class="flex items-center gap-2 text-sm font-semibold"><span class="inline-flex h-6 w-6 items-center justify-center rounded bg-emerald-500 text-zinc-950">₹</span>Chitragupt</a>
    <a href="sign-in.html" class="text-[11px] text-zinc-400">Sign in</a>
  </div>

  <main class="px-5 pb-10 pt-4">
    <p class="text-[10px] uppercase tracking-widest text-emerald-300">Free to start</p>
    <h1 class="mt-1 text-2xl font-semibold tracking-tight">Create your Chitragupt account</h1>
    <p class="mt-1.5 text-[13px] text-zinc-400">Drop in your tax docs. Pay ₹249 only when you want answers.</p>

    <button class="mt-6 flex w-full items-center justify-center gap-2.5 rounded-xl border border-zinc-700 bg-zinc-900 px-4 py-3.5 text-sm font-medium">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.87 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.91-2.26c-.8.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A8.99 8.99 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58A9 9 0 0 0 9 0 8.99 8.99 0 0 0 .96 4.96l3 2.33C4.67 5.17 6.66 3.58 9 3.58z"/></svg>
      Sign up with Google
    </button>

    <div class="my-5 flex items-center gap-3"><div class="h-px flex-1 bg-zinc-800"></div><span class="text-[10px] uppercase tracking-widest text-zinc-500">or with email</span><div class="h-px flex-1 bg-zinc-800"></div></div>

    <form class="space-y-3.5">
      <label class="block"><span class="text-[11px] text-zinc-400">Full name</span><input type="text" placeholder="Aarav Sharma" class="mt-1 block w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-3 text-sm placeholder:text-zinc-600 focus:border-emerald-500 focus:outline-none"/></label>
      <label class="block"><span class="text-[11px] text-zinc-400">Email</span><input type="email" placeholder="you@example.com" class="mt-1 block w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-3 text-sm placeholder:text-zinc-600 focus:border-emerald-500 focus:outline-none"/><p class="mt-1 text-[10px] text-zinc-500">We'll send a verification code here. Check spam if it doesn't arrive.</p></label>
      <label class="block"><span class="text-[11px] text-zinc-400">Password</span><input type="password" class="mt-1 block w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-3 text-sm focus:border-emerald-500 focus:outline-none"/>
        <!-- strength meter -->
        <div class="mt-2 flex items-center gap-2">
          <div class="flex h-1 flex-1 gap-1">
            <div class="h-full flex-1 rounded-full bg-emerald-500"></div>
            <div class="h-full flex-1 rounded-full bg-emerald-500"></div>
            <div class="h-full flex-1 rounded-full bg-emerald-500"></div>
          </div>
          <span class="text-[11px] text-emerald-400">Strong</span>
        </div>
        <p class="mt-1 text-[10px] text-zinc-500">8+ characters. Or use Google above to skip passwords entirely.</p>
      </label>

      <label class="block"><span class="text-[11px] text-zinc-400">Confirm password</span><input type="password" class="mt-1 block w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-3 text-sm focus:border-emerald-500 focus:outline-none"/></label>

      <label class="flex items-start gap-2 text-[11px] text-zinc-400"><input type="checkbox" class="mt-0.5 h-4 w-4 rounded border-zinc-700 bg-zinc-900 accent-emerald-500" checked/>I agree to the <a href="#" class="text-emerald-300 underline">Terms</a> &amp; <a href="#" class="text-emerald-300 underline">Privacy Policy</a> (DPDP Act 2023).</label>

      <label class="flex items-start gap-2 text-[11px] text-zinc-400"><input type="checkbox" class="mt-0.5 h-4 w-4 rounded border-zinc-700 bg-zinc-900 accent-emerald-500"/>Send me one email per assessment year with a pricing reminder. Nothing else. (optional)</label>

      <a href="verify-email.html" class="mt-1 block w-full rounded-xl bg-emerald-500 px-4 py-3.5 text-center text-sm font-semibold text-zinc-950">Create account →</a>
    </form>

    <p class="mt-8 border-t border-zinc-900 pt-4 text-center text-[10px] text-zinc-500">Hosted in India · 7 working day support SLA · refund within 14 days of unlock</p>
  </main>

  <div class="flex items-center justify-center pb-2 pt-1"><div class="h-1 w-32 rounded-full bg-zinc-700"></div></div>
</div>

</body>
</html>
