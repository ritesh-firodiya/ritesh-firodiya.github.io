<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload modal — Chitragupt mobile</title>
  <script src="../../../_vendor/tailwind.js"></script>
  <style>
    body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0a0a0a}
    .mono{font-family:ui-monospace,monospace}
    .phone{max-width:390px;margin:0 auto;background:#09090b;min-height:100dvh;position:relative;box-shadow:0 0 0 1px #18181b}
    @media (min-width:640px){.phone{min-height:844px;margin:16px auto;border-radius:32px;overflow:hidden;box-shadow:0 0 0 1px #27272a,0 30px 60px -20px rgba(0,0,0,.7)}}
  </style>
</head>
<body class="text-zinc-100">

<div class="border-b border-dashed border-zinc-800 bg-zinc-900/30 px-5 py-2">
  <div class="mx-auto flex max-w-4xl flex-wrap items-center gap-1.5 text-[11px]">
    <span class="mr-1 text-[10px] uppercase tracking-widest text-zinc-500">Mobile · /patterns ›</span>
    <a href="upload-modal.html" class="rounded border border-emerald-500/50 bg-emerald-500/15 px-2 py-0.5 font-semibold text-emerald-200">Upload modal</a>
    <a href="confirm-destructive.html" class="rounded border border-zinc-700 bg-zinc-900 px-2 py-0.5 text-zinc-300">Confirm destructive</a>
    <a href="toasts.html" class="rounded border border-zinc-700 bg-zinc-900 px-2 py-0.5 text-zinc-300">Toasts</a>
    <a href="../index.html" class="ml-auto rounded border border-zinc-700 bg-zinc-900 px-2 py-0.5 text-zinc-300">← All</a>
  </div>
</div>

<div class="phone">

  <!-- Dim blurred host page -->
  <div class="absolute inset-0 z-0 opacity-30 blur-sm pointer-events-none">
    <div class="flex h-12 items-center justify-between px-3">
      <span class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-zinc-800 bg-zinc-900 text-[11px] font-semibold text-zinc-200">AS</span>
      <h1 class="text-base font-semibold">Dashboard</h1>
      <span class="inline-flex h-9 w-9"></span>
    </div>
    <div class="px-4 mt-2 space-y-3">
      <div class="rounded-2xl border border-zinc-800 h-24"></div>
      <div class="rounded-2xl border border-zinc-800 h-32"></div>
    </div>
  </div>

  <!-- Modal sheet -->
  <div class="absolute inset-0 z-10 flex items-end bg-black/60">
    <div class="w-full rounded-t-3xl border-t border-zinc-800 bg-zinc-950 p-5 pb-8">
      <div class="mx-auto h-1 w-10 rounded-full bg-zinc-700"></div>
      <div class="mt-4 flex items-start justify-between gap-3">
        <div>
          <p class="text-[10px] uppercase tracking-widest text-emerald-300">Add to Inbox</p>
          <h2 class="mt-1 text-lg font-semibold">Upload documents</h2>
        </div>
        <button class="rounded p-1 text-zinc-500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>

      <label class="mt-4 block rounded-2xl border-2 border-dashed border-emerald-500/40 bg-emerald-500/5 p-6 text-center">
        <span class="mx-auto inline-flex h-12 w-12 items-center justify-center rounded-full bg-emerald-500/20"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
        <p class="mt-3 text-[14px] font-medium text-zinc-100">Choose files</p>
        <p class="mt-1 text-[11px] text-zinc-500">PDF · XLSX · ZIP · 25 MB</p>
        <input type="file" class="hidden" multiple accept=".pdf,.xlsx,.xls,.csv,.zip" />
      </label>

      <div class="mt-3 grid grid-cols-2 gap-2 text-[12px]">
        <button class="flex items-center justify-center gap-1.5 rounded-md border border-zinc-700 bg-zinc-900 py-2.5 text-zinc-200"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="13" r="3"/><path d="M8 7h.01"/></svg>Camera</button>
        <button class="flex items-center justify-center gap-1.5 rounded-md border border-zinc-700 bg-zinc-900 py-2.5 text-zinc-200"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>Share sheet</button>
      </div>

      <div class="mt-4 grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] uppercase tracking-widest text-zinc-500">Assessment year</label>
          <select class="mt-1 block w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-2 text-[12px] text-zinc-200">
            <option>AY 2026-27</option>
            <option>AY 2025-26</option>
            <option>Auto-detect</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] uppercase tracking-widest text-zinc-500">Folder</label>
          <select class="mt-1 block w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-2 text-[12px] text-zinc-200">
            <option>Auto-route</option>
            <option>Tax</option>
            <option>Bank</option>
          </select>
        </div>
      </div>

      <button class="mt-5 block w-full rounded-xl bg-emerald-500 py-3 text-sm font-semibold text-zinc-950">Upload</button>
      <p class="mt-3 text-center text-[10px] text-zinc-500">Parses automatically · result lands in Inbox</p>
    </div>
  </div>

</div>

</body>
</html>
