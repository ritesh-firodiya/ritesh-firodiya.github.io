<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload modal — Chitragupt</title>
  <script src="../../../_vendor/tailwind.js"></script>
  <style>body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">

<!-- ─── WIREFRAME DEMO SUPER-HEADER ─── -->
<div class="border-b border-dashed border-zinc-800 bg-zinc-900/30 px-5 py-2">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-1.5 text-[11px]">
    <span class="mr-1 text-[10px] uppercase tracking-widest text-zinc-500">Demo · <span class="text-zinc-300">/patterns</span> ›</span>
    <a href="upload-modal.html" class="rounded border border-emerald-500/50 bg-emerald-500/15 px-2 py-0.5 text-[11px] font-semibold text-emerald-200">Upload modal</a>
    <a href="confirm-destructive.html" class="rounded border border-zinc-700 bg-zinc-900 px-2 py-0.5 text-[11px] text-zinc-300 hover:border-emerald-500/40">Confirm destructive</a>
    <a href="toasts.html" class="rounded border border-zinc-700 bg-zinc-900 px-2 py-0.5 text-[11px] text-zinc-300 hover:border-emerald-500/40">Toasts</a>
    <a href="../index.html" class="ml-auto rounded border border-zinc-700 bg-zinc-900 px-2 py-0.5 text-[11px] text-zinc-300 hover:border-emerald-500/40">← All routes</a>
  </div>
</div>
<!-- ─── END ─── -->

<!-- Blurred page behind modal -->
<div class="pointer-events-none fixed inset-0 z-0 select-none">
  <header class="border-b border-zinc-900 opacity-30">
    <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-5">
      <p class="text-sm font-semibold">Chitragupt</p>
      <p class="text-[11px] text-zinc-500">Viewing as Aarav · personal</p>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-5 py-8 opacity-30 blur-sm">
    <h1 class="text-2xl font-semibold">Dashboard</h1>
    <div class="mt-6 grid gap-5 md:grid-cols-3">
      <div class="rounded-xl border border-emerald-500/40 bg-emerald-500/5 h-32"></div>
      <div class="rounded-xl border border-zinc-800 bg-zinc-950 h-32 md:col-span-2"></div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="fixed inset-0 z-10 flex items-center justify-center bg-black/60 px-4">
  <div class="w-full max-w-xl rounded-2xl border border-zinc-800 bg-zinc-950 p-6 shadow-2xl">

    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-[10px] uppercase tracking-widest text-emerald-300">Add to Inbox</p>
        <h2 class="mt-1 text-xl font-semibold tracking-tight">Upload documents</h2>
        <p class="mt-1 text-[12px] text-zinc-400">PDF · XLSX · ZIP · 25 MB per doc · free forever</p>
      </div>
      <button class="rounded p-1 text-zinc-500 hover:bg-zinc-900 hover:text-zinc-200" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>

    <!-- Dropzone -->
    <label class="mt-5 block cursor-pointer rounded-2xl border-2 border-dashed border-emerald-500/40 bg-emerald-500/5 p-10 text-center hover:border-emerald-500 hover:bg-emerald-500/10">
      <span class="mx-auto inline-flex h-14 w-14 items-center justify-center rounded-full bg-emerald-500/20"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
      <p class="mt-3 text-sm font-medium text-zinc-100">Drop files here, or click to browse</p>
      <p class="mt-1 text-[11px] text-zinc-500">Drop a ZIP and we expand it</p>
      <input type="file" class="hidden" multiple accept=".pdf,.xlsx,.xls,.csv,.zip" />
    </label>

    <!-- AY + folder routing hint -->
    <div class="mt-4 grid gap-2 sm:grid-cols-2">
      <div>
        <label class="text-[10px] uppercase tracking-widest text-zinc-500">Assessment year</label>
        <select class="mt-1 block w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-2 text-[12px] text-zinc-200">
          <option>AY 2026-27 (current)</option>
          <option>AY 2025-26</option>
          <option>AY 2024-25</option>
          <option>Auto-detect from doc</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] uppercase tracking-widest text-zinc-500">Folder</label>
        <select class="mt-1 block w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-2 text-[12px] text-zinc-200">
          <option>Auto-route from doc type</option>
          <option>Tax</option>
          <option>Bank · HDFC ****1234</option>
          <option>Investments</option>
          <option>Health</option>
        </select>
      </div>
    </div>

    <div class="mt-5 flex flex-col-reverse items-stretch gap-3 sm:flex-row sm:items-center sm:justify-between">
      <button class="text-xs text-zinc-500 hover:text-zinc-300">Cancel</button>
      <button class="rounded-md bg-emerald-500 px-5 py-2.5 text-sm font-semibold text-zinc-950 hover:bg-emerald-400">Upload</button>
    </div>

    <p class="mt-4 text-center text-[10px] text-zinc-500">Parses automatically · we'll show you the result in Inbox</p>
  </div>
</div>

</body>
</html>
