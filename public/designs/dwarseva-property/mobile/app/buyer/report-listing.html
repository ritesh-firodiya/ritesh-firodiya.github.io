<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Report listing — Dwarseva mobile</title>
  <script src="../../../../_vendor/tailwind.js"></script>
<style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f5; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .phone { max-width: 390px; margin: 0 auto; background: #09090b; min-height: 100dvh; position: relative; box-shadow: 0 0 0 1px #18181b; }
    @media (min-width: 640px) { .phone { min-height: 844px; margin-top: 16px; margin-bottom: 16px; border-radius: 32px; box-shadow: 0 0 0 1px #27272a, 0 30px 60px -20px rgba(0,0,0,0.7); overflow: hidden; } }
  </style>
</head>
<body class="text-zinc-900">



<div class="phone bg-white shadow-[0_0_0_1px_#e4e4e7] sm:shadow-[0_0_0_1px_#d4d4d8,0_30px_60px_-20px_rgba(24,24,27,0.18)]">

  <div class="flex items-center justify-between px-6 pt-3 pb-1 text-[11px] text-zinc-700">
    <span class="mono">9:41</span>
    <div class="flex items-center gap-1.5">
      <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><rect x="0" y="6" width="2" height="4" rx="0.5"/><rect x="3.5" y="4" width="2" height="6" rx="0.5"/><rect x="7" y="2" width="2" height="8" rx="0.5"/><rect x="10.5" y="0" width="2" height="10" rx="0.5"/></svg>
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4a8 8 0 0 1 12 0M3 6a5 5 0 0 1 8 0M6 8.5l1 1 1-1"/></svg>
      <svg width="22" height="11" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="18" height="10" rx="2"/><rect x="19.5" y="3.5" width="2" height="4" rx="0.5" fill="currentColor"/><rect x="2" y="2" width="13" height="7" rx="1" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="flex h-12 items-center justify-between px-4">
    <a href="property-detail-unlocked.html" aria-label="Back" class="inline-flex h-10 w-10 items-center justify-center text-zinc-700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="text-sm font-semibold">Report listing</h1>
    <span class="w-10"></span>
  </div>

  <main class="px-5 pb-10 pt-4">

    <section class="rounded-2xl border border-zinc-200 bg-zinc-100/75 p-4">
      <p class="text-[10px] uppercase tracking-widest text-zinc-500">You're reporting</p>
      <p class="mt-1 text-sm font-semibold">2BHK · Aundh · Kumar Park · ₹28,000/mo</p>
      <p class="text-[11px] text-zinc-600">Owner shown: Sanjay Patil</p>
    </section>

    <p class="mt-5 text-[11px] font-semibold text-zinc-700">What's wrong?</p>
    <div class="mt-2 space-y-2">

      <label class="flex cursor-pointer items-center justify-between rounded-xl border border-rose-500/40 bg-rose-500/10 p-3.5">
        <div>
          <p class="text-sm font-semibold">Already sold or rented</p>
          <p class="text-[10.5px] text-zinc-600">Owner said it's gone when I called</p>
        </div>
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-full bg-rose-500 text-zinc-950">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
      </label>

      <label class="flex cursor-pointer items-center justify-between rounded-xl border border-zinc-200 bg-white p-3.5">
        <div>
          <p class="text-sm">Photos don't match property</p>
        </div>
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-zinc-300"></span>
      </label>

      <label class="flex cursor-pointer items-center justify-between rounded-xl border border-zinc-200 bg-white p-3.5">
        <div>
          <p class="text-sm">Wrong location</p>
        </div>
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-zinc-300"></span>
      </label>

      <label class="flex cursor-pointer items-center justify-between rounded-xl border border-zinc-200 bg-white p-3.5">
        <div>
          <p class="text-sm">Owner is actually a broker</p>
          <p class="text-[10.5px] text-zinc-600">No "Agent" badge, but admitting it</p>
        </div>
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-zinc-300"></span>
      </label>

      <label class="flex cursor-pointer items-center justify-between rounded-xl border border-zinc-200 bg-white p-3.5">
        <div>
          <p class="text-sm">Asked for money advance before visit</p>
          <p class="text-[10.5px] text-rose-700">Likely scam — we'll act fast</p>
        </div>
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-zinc-300"></span>
      </label>

      <label class="flex cursor-pointer items-center justify-between rounded-xl border border-zinc-200 bg-white p-3.5">
        <div><p class="text-sm">Other</p></div>
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-zinc-300"></span>
      </label>

    </div>

    <label class="mt-5 block">
      <span class="text-[11px] text-zinc-600">Tell us more (optional)</span>
      <textarea rows="3" placeholder="Specific things the owner said, time of call, anything else useful." class="mt-1 block w-full rounded-md border border-zinc-200 bg-white px-3 py-3 text-[12px] text-zinc-900 placeholder:text-zinc-600 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500/40"></textarea>
    </label>

    <button class="mt-3 flex items-center gap-2 rounded-md border border-zinc-300 bg-white px-3 py-2 text-[11px] text-zinc-700">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      + Attach screenshot of chat
    </button>

    <a href="unlock-history.html" class="mt-5 block w-full rounded-xl bg-rose-500 px-4 py-3.5 text-center text-sm font-semibold text-zinc-950 hover:bg-rose-400">
      Submit report
    </a>

  </main>

  <div class="flex items-center justify-center pb-2 pt-1">
    <div class="h-1 w-32 rounded-full bg-zinc-200"></div>
  </div>

</div>

</body>
</html>
