<!doctype html>

<style>

<body class="text-zinc-900">



<div class="phone bg-white shadow-[0_0_0_1px_#e4e4e7] sm:shadow-[0_0_0_1px_#d4d4d8,0_30px_60px_-20px_rgba(24,24,27,0.18)] bg-[radial-gradient(circle_at_50%_30%,rgba(244,244,245,0.4),rgba(24,24,27,0.55))]">

  <div class="flex items-center justify-between px-6 pt-3 pb-1 text-[11px] text-zinc-600">

      </div>

        <div class="flex items-center justify-between text-[12px]">
          <span class="text-zinc-600">Current wallet</span>
          <span class="mono font-semibold text-zinc-900">₹71</span>

        <div class="mt-2 flex items-center justify-between text-[12px]">

          <span class="mono font-semibold text-rose-700">− ₹5</span>

        <div class="flex items-center justify-between text-[13px]">
          <span class="font-semibold text-zinc-800">After</span>
          <span class="mono font-semibold text-emerald-700">₹66</span>

      <div class="mt-5 grid grid-cols-2 gap-2">

        <a href="property-detail-unlocked.html" class="rounded-xl bg-amber-500 px-3 py-3 text-center text-sm font-semibold text-zinc-950 hover:bg-amber-400">Unlock</a>
      </div>

      <div class="mt-5 flex items-center justify-center">
        <div class="h-1 w-32 rounded-full bg-zinc-200"></div>
