<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>City selector — Dwarseva mobile</title>
  <script src="../../../_vendor/tailwind.js"></script>
<style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f5; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .phone { max-width: 390px; margin: 0 auto; background: #09090b; min-height: 100dvh; position: relative; box-shadow: 0 0 0 1px #18181b; }
    @media (min-width: 640px) { .phone { min-height: 844px; margin-top: 16px; margin-bottom: 16px; border-radius: 32px; box-shadow: 0 0 0 1px #27272a, 0 30px 60px -20px rgba(0,0,0,0.7); overflow: hidden; } }
  </style>
</head>
<body class="text-zinc-900">



<div class="phone bg-white shadow-[0_0_0_1px_#e4e4e7] sm:shadow-[0_0_0_1px_#d4d4d8,0_30px_60px_-20px_rgba(24,24,27,0.18)]">

  <div class="flex items-center justify-between px-6 pt-3 pb-1 text-[11px] text-zinc-700">
    <span class="mono">9:41</span>
    <div class="flex items-center gap-1.5">
      <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><rect x="0" y="6" width="2" height="4" rx="0.5"/><rect x="3.5" y="4" width="2" height="6" rx="0.5"/><rect x="7" y="2" width="2" height="8" rx="0.5"/><rect x="10.5" y="0" width="2" height="10" rx="0.5"/></svg>
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4a8 8 0 0 1 12 0M3 6a5 5 0 0 1 8 0M6 8.5l1 1 1-1"/></svg>
      <svg width="22" height="11" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="18" height="10" rx="2"/><rect x="19.5" y="3.5" width="2" height="4" rx="0.5" fill="currentColor"/><rect x="2" y="2" width="13" height="7" rx="1" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="flex h-12 items-center justify-between px-4">
    <a href="../auth/otp.html" aria-label="Back" class="inline-flex h-10 w-10 items-center justify-center text-zinc-700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="text-sm font-semibold">Where are you?</h1>
    <span class="w-10"></span>
  </div>

  <div class="px-5 pt-1">
    <div class="flex items-center gap-1.5">
      <div class="h-1 flex-1 rounded-full bg-blue-500"></div>
      <div class="h-1 flex-1 rounded-full bg-zinc-100"></div>
    </div>
    <p class="mt-1 text-[10px] text-zinc-500">Step 1 of 2 · City</p>
  </div>

  <main class="px-5 pb-10 pt-4">

    <h2 class="text-[22px] font-semibold tracking-tight">Pick your city</h2>
    <p class="mt-1 text-[12.5px] text-zinc-600">Search any city in India.</p>

    <label class="mt-4 flex items-center rounded-xl border border-zinc-200 bg-white focus-within:border-blue-500">
      <span class="pl-3 text-zinc-500">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </span>
      <input type="search" placeholder="Search city or neighbourhood" class="block w-full bg-transparent px-3 py-3 text-sm text-zinc-900 placeholder:text-zinc-600 focus:outline-none" />
    </label>

    <p class="mt-5 text-[10px] uppercase tracking-widest text-zinc-500">Popular cities</p>
    <div class="mt-2 flex flex-wrap gap-2">
      <button class="rounded-full border border-blue-500 bg-blue-500/15 px-3 py-1.5 text-[12px] font-semibold text-blue-700">Pune</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Mumbai</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Bengaluru</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Delhi NCR</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Hyderabad</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Chennai</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Kolkata</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Ahmedabad</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Indore</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Kochi</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Jaipur</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Lucknow</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Chandigarh</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Bhopal</button>
      <button class="rounded-full border border-zinc-200 bg-white px-3 py-1.5 text-[12px] text-zinc-800">Nagpur</button>
    </div>

    <a href="role-select.html" class="mt-6 block w-full rounded-xl bg-blue-500 px-4 py-3.5 text-center text-sm font-semibold text-zinc-950 hover:bg-blue-400">
      Continue · Pune →
    </a>

  </main>

  <div class="flex items-center justify-center pb-2 pt-1">
    <div class="h-1 w-32 rounded-full bg-zinc-200"></div>
  </div>

</div>

</body>
</html>
