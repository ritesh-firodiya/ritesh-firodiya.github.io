<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit profile — Dwarseva mobile</title>
  <script src="../../../_vendor/tailwind.js"></script>
<style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f5; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .phone { max-width: 390px; margin: 0 auto; background: #09090b; min-height: 100dvh; position: relative; box-shadow: 0 0 0 1px #18181b; }
    @media (min-width: 640px) { .phone { min-height: 844px; margin-top: 16px; margin-bottom: 16px; border-radius: 32px; box-shadow: 0 0 0 1px #27272a, 0 30px 60px -20px rgba(0,0,0,0.7); overflow: hidden; } }
    .h { font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: #71717a; }
  </style>
</head>
<body class="text-zinc-900">

<div class="border-b border-dashed border-zinc-200 bg-zinc-100/60 px-5 py-2">
  <div class="mx-auto flex max-w-4xl flex-wrap items-center gap-1.5 text-[11px]">
    <span class="mr-1 text-[10px] uppercase tracking-widest text-zinc-500">Mobile · <span class="text-zinc-700">/settings</span> ›</span>
    <a href="settings.html" class="rounded border border-zinc-300 bg-white px-2 py-0.5 text-[11px] text-zinc-700 hover:border-blue-500/40">Settings</a>
    <a href="profile-edit.html" class="rounded border border-blue-500/50 bg-blue-500/15 px-2 py-0.5 text-[11px] font-semibold text-blue-700">Edit profile</a>
    <a href="notifications.html" class="rounded border border-zinc-300 bg-white px-2 py-0.5 text-[11px] text-zinc-700 hover:border-blue-500/40">Notifications</a>
    <a href="../index.html" class="ml-auto rounded border border-zinc-300 bg-white px-2 py-0.5 text-[11px] text-zinc-700 hover:border-blue-500/40">← All routes</a>
  </div>
</div>

<div class="phone bg-white shadow-[0_0_0_1px_#e4e4e7] sm:shadow-[0_0_0_1px_#d4d4d8,0_30px_60px_-20px_rgba(24,24,27,0.18)]">

  <div class="flex items-center justify-between px-6 pt-3 pb-1 text-[11px] text-zinc-700">
    <span class="mono">9:41</span>
    <div class="flex items-center gap-1.5">
      <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><rect x="0" y="6" width="2" height="4" rx="0.5"/><rect x="3.5" y="4" width="2" height="6" rx="0.5"/><rect x="7" y="2" width="2" height="8" rx="0.5"/><rect x="10.5" y="0" width="2" height="10" rx="0.5"/></svg>
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4a8 8 0 0 1 12 0M3 6a5 5 0 0 1 8 0M6 8.5l1 1 1-1"/></svg>
      <svg width="22" height="11" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="18" height="10" rx="2"/><rect x="19.5" y="3.5" width="2" height="4" rx="0.5" fill="currentColor"/><rect x="2" y="2" width="13" height="7" rx="1" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="flex h-12 items-center justify-between px-4">
    <a href="settings.html" aria-label="Back" class="inline-flex h-10 w-10 items-center justify-center text-zinc-700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="text-sm font-semibold">Edit profile</h1>
    <span class="w-10"></span>
  </div>

  <main class="px-5 pb-10 pt-4 space-y-5">

    <section class="flex items-center gap-3">
      <span class="inline-flex h-14 w-14 items-center justify-center rounded-full bg-blue-500/20 text-lg font-semibold text-blue-700">AP</span>
      <button class="text-[11px] text-blue-700 underline">Change avatar</button>
    </section>

    <label class="block">
      <span class="text-[11px] text-zinc-600">Full name</span>
      <input type="text" value="Aniket Patil" class="mt-1 block w-full rounded-md border border-zinc-200 bg-white px-3 py-3 text-sm text-zinc-900 focus:border-blue-500 focus:outline-none" />
    </label>

    <label class="block">
      <span class="text-[11px] text-zinc-600">Email</span>
      <input type="email" value="aniket.patil@example.com" class="mt-1 block w-full rounded-md border border-zinc-200 bg-white px-3 py-3 text-sm text-zinc-900 focus:border-blue-500 focus:outline-none" />
    </label>

    <section>
      <p class="h">Phone</p>
      <p class="mono mt-1 text-[13px] text-zinc-700">+91 98220 14455</p>
      <p class="text-[10.5px] text-zinc-500">Changing phone requires a new OTP verification — <a href="#" class="text-blue-700 underline">start that</a>.</p>
    </section>

    <section>
      <p class="h">Role</p>
      <p class="mt-1 text-[12.5px] text-zinc-700">Seller + Buyer</p>
      <a href="../onboarding/role-select.html" class="text-[10.5px] text-blue-700 underline">Change role</a>
    </section>

    <a href="settings.html" class="block w-full rounded-xl bg-blue-500 px-4 py-3 text-center text-sm font-semibold text-zinc-950 hover:bg-blue-400">
      Save changes
    </a>

  </main>

  <div class="flex items-center justify-center pb-2 pt-1">
    <div class="h-1 w-32 rounded-full bg-zinc-200"></div>
  </div>

</div>

</body>
</html>
