<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recharge — Dwarseva mobile</title>
  <script src="../../../_vendor/tailwind.js"></script>
<style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f5; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .phone { max-width: 390px; margin: 0 auto; background: #09090b; min-height: 100dvh; position: relative; box-shadow: 0 0 0 1px #18181b; }
    @media (min-width: 640px) { .phone { min-height: 844px; margin-top: 16px; margin-bottom: 16px; border-radius: 32px; box-shadow: 0 0 0 1px #27272a, 0 30px 60px -20px rgba(0,0,0,0.7); overflow: hidden; } }
  </style>
</head>
<body class="text-zinc-900">



<div class="phone bg-white shadow-[0_0_0_1px_#e4e4e7] sm:shadow-[0_0_0_1px_#d4d4d8,0_30px_60px_-20px_rgba(24,24,27,0.18)]">

  <div class="flex items-center justify-between px-6 pt-3 pb-1 text-[11px] text-zinc-700">
    <span class="mono">9:41</span>
    <div class="flex items-center gap-1.5">
      <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor"><rect x="0" y="6" width="2" height="4" rx="0.5"/><rect x="3.5" y="4" width="2" height="6" rx="0.5"/><rect x="7" y="2" width="2" height="8" rx="0.5"/><rect x="10.5" y="0" width="2" height="10" rx="0.5"/></svg>
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4a8 8 0 0 1 12 0M3 6a5 5 0 0 1 8 0M6 8.5l1 1 1-1"/></svg>
      <svg width="22" height="11" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="18" height="10" rx="2"/><rect x="19.5" y="3.5" width="2" height="4" rx="0.5" fill="currentColor"/><rect x="2" y="2" width="13" height="7" rx="1" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="flex h-12 items-center justify-between px-4">
    <a href="wallet.html" aria-label="Back" class="inline-flex h-10 w-10 items-center justify-center text-zinc-700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="text-sm font-semibold">Recharge wallet</h1>
    <span class="w-10"></span>
  </div>

  <main class="px-5 pb-10 pt-4">

    <div class="rounded-2xl border border-blue-500/30 bg-blue-500/10 p-4">
      <p class="text-[10px] uppercase tracking-widest text-blue-700">Current balance</p>
      <p class="mono mt-1 text-2xl font-semibold">₹71</p>
    </div>

    <p class="mt-5 text-[11px] font-semibold text-zinc-700">Amount</p>
    <div class="mt-2 grid grid-cols-3 gap-2">
      <label class="cursor-pointer rounded-xl border border-zinc-200 bg-white p-3 text-center">
        <p class="mono text-base font-semibold text-zinc-900">₹10</p>
        <p class="mt-1 text-[10px] text-zinc-500">2 unlocks</p>
      </label>
      <label class="cursor-pointer rounded-xl border-2 border-blue-500 bg-blue-500/10 p-3 text-center">
        <p class="mono text-base font-semibold text-blue-700">₹50</p>
        <p class="mt-1 text-[10px] text-blue-700">10 unlocks</p>
        <span class="mt-1 inline-block rounded bg-blue-500/30 px-1 py-0.5 text-[9px] uppercase text-blue-700">popular</span>
      </label>
      <label class="cursor-pointer rounded-xl border border-zinc-200 bg-white p-3 text-center">
        <p class="mono text-base font-semibold text-zinc-900">₹100</p>
        <p class="mt-1 text-[10px] text-zinc-500">20 unlocks</p>
      </label>
    </div>

    <details class="mt-3 rounded-xl border border-zinc-200 bg-zinc-100/75 p-3">
      <summary class="cursor-pointer text-[12px] text-zinc-700">Custom amount</summary>
      <div class="mt-2 flex items-center rounded-md border border-zinc-200 bg-white">
        <span class="mono px-3 py-2.5 text-sm text-zinc-600 border-r border-zinc-200">₹</span>
        <input type="text" inputmode="numeric" placeholder="Min ₹10" class="mono block w-full bg-transparent px-3 py-2.5 text-sm text-zinc-900 focus:outline-none" />
      </div>
    </details>

    <p class="mt-5 text-[11px] font-semibold text-zinc-700">Pay with</p>
    <div class="mt-2 space-y-2">
      <label class="flex items-center justify-between cursor-pointer rounded-xl border border-blue-500 bg-blue-500/10 p-3">
        <div class="flex items-center gap-3">
          <span class="inline-flex h-9 w-9 items-center justify-center rounded-md bg-zinc-100 text-blue-700">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 12l4-4 4 4-4 4z"/><path d="M9 6l4-4 4 4-4 4z" opacity=".7"/><path d="M9 18l4-4 4 4-4 4z" opacity=".7"/></svg>
          </span>
          <div>
            <p class="text-sm font-semibold">UPI</p>
            <p class="text-[10.5px] text-zinc-600">GPay · PhonePe · BHIM · Paytm</p>
          </div>
        </div>
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-full bg-blue-500 text-zinc-950">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
      </label>

      <label class="flex items-center justify-between cursor-pointer rounded-xl border border-zinc-200 bg-white p-3 opacity-60">
        <div class="flex items-center gap-3">
          <span class="inline-flex h-9 w-9 items-center justify-center rounded-md bg-zinc-100 text-zinc-600">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          </span>
          <div>
            <p class="text-sm">Card</p>
            <p class="text-[10.5px] text-zinc-500">Coming soon · v2</p>
          </div>
        </div>
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-full border border-zinc-300"></span>
      </label>
    </div>

    <a href="wallet.html" class="mt-6 block w-full rounded-xl bg-blue-500 px-4 py-3.5 text-center text-sm font-semibold text-zinc-950 hover:bg-blue-400">
      Pay ₹50 via UPI →
    </a>


  </main>

  <div class="flex items-center justify-center pb-2 pt-1">
    <div class="h-1 w-32 rounded-full bg-zinc-200"></div>
  </div>

</div>

</body>
</html>
