<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pattaya — Mood + sleep</title>
  <script src="../../../_vendor/tailwind.js"></script>
  <script src="../tailwind.config.js"></script>
  <script src="../../../_vendor/lucide.js"></script>
  <link rel="stylesheet" href="../shared.css" />
</head>
<body>



<div class="screen-layout">
  <div class="screen-card">
    <div class="screen-card-title">Mood & Sleep</div>
    <div class="screen-card-content">
      <p><strong>Purpose:</strong> Track daily mood and sleep patterns.</p>
      <p class="mt-2"><strong>Features:</strong></p>
      <ul class="list-disc list-inside mt-1 space-y-1">
        <li>Mood logging</li>
        <li>Sleep tracking</li>
        <li>Pattern insights</li>
      </ul>
    </div>
  </div>

<div class="phone">
  <div class="statusbar">
    <span class="statusbar-time">9:41</span>
    <span class="statusbar-icons text-xs">••• 5G ■</span>
  </div>

  <div class="appheader">
    <button class="iconbtn"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
    <p class="text-[15px] font-black teal">How are you today?</p>
    <button class="chip chip-teal">Save</button>
  </div>

  <div class="px-6 pb-24">
    <!-- Not-yet-logged partner banner -->
    <div class="card card--sunken flex items-center gap-3">
      <div class="avatar avatar-r" style="width:26px;height:26px;font-size:11px">R</div>
      <p class="flex-1 text-[12px]">Rahul hasn't logged today · gentle nudge sent</p>
    </div>

    <!-- Mood picker -->
    <div class="mt-6">
      <p class="section-label">Mood</p>
      <div class="mt-3 flex justify-between px-1">
        <button class="text-4xl">😞</button>
        <button class="text-4xl">😕</button>
        <button class="text-4xl">😌</button>
        <button class="text-4xl scale-125 drop-shadow">🙂</button>
        <button class="text-4xl">😊</button>
      </div>
      <div class="mt-3">
        <input class="w-full p-3 rounded-lg border border-[color:var(--border)] bg-white text-[13px] outline-none" placeholder="One word for today (optional)" value="Content" />
      </div>
    </div>

    <!-- Sleep -->
    <div class="mt-6">
      <p class="section-label">Sleep last night</p>
      <div class="mt-3 card">
        <div class="flex items-baseline justify-between">
          <p class="text-[13px] text-[color:var(--text-tertiary)]">Hours</p>
          <p class="text-4xl font-black teal">7.5<span class="text-lg text-[color:var(--text-tertiary)]"> hrs</span></p>
        </div>
        <input type="range" min="0" max="12" step="0.5" value="7.5" class="w-full mt-3 accent-[color:var(--teal-500)]" />
      </div>
      <div class="mt-3 grid grid-cols-3 gap-2">
        <button class="card card--interactive text-center py-3 text-[12px] font-bold text-[color:var(--text-tertiary)]">Poor</button>
        <button class="card card--interactive text-center py-3 text-[12px] font-bold border-teal teal">Ok</button>
        <button class="card card--interactive text-center py-3 text-[12px] font-bold text-[color:var(--text-tertiary)]">Great</button>
      </div>
    </div>

    <!-- Note -->
    <div class="mt-6">
      <p class="section-label">One note (optional)</p>
      <textarea class="mt-2 w-full h-20 p-3 rounded-lg border border-[color:var(--border)] bg-white text-[13px] outline-none" placeholder="What made today what it was?"></textarea>
    </div>
  </div>
</div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
